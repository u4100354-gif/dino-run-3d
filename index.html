<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#22261e"><title>Dino Run 3D · Каньон</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><svg viewBox="0 0 24 20" aria-hidden="true"><path fill="currentColor" d="M1 7h2v3h3v2h3V9h3V2h10v6h-6v2h4v2h-5v3h-3v4H9v-3H6v3H4v-5H2v-3H1z"/><path fill="#26291e" d="M15 3h2v2h-2z"/></svg>DINO RUN <b>3D</b></div><div class="top-actions"><span id="record">РЕКОРД <strong>00000</strong></span><button id="sound" aria-label="Выключить звук" title="Звук">♪</button><button id="pause" hidden aria-label="Пауза">Ⅱ</button></div></header>
<main><canvas id="scene" aria-label="Трёхмерная трасса в пустынном каньоне"></canvas>
<section id="intro"><div class="eyebrow"><i></i> ПУСТЫННАЯ АРКАДА</div><h1>DINO<br><em>RUN</em><sup>3D</sup></h1><p id="desc"></p><button class="primary" id="start">Начать забег <span>▶</span></button></section>
<div id="picker"><div class="section-name">ВЫБОР ТРАССЫ</div><div id="levels"></div></div>
<div id="hud" hidden><div><small id="track"></small><b id="meters"></b></div><div class="progress"><i id="bar"></i></div><div class="points"><small>ОЧКИ</small><b id="score"></b><small id="shield"></small></div></div>
<section id="modal" hidden role="dialog" aria-labelledby="title"><div class="card"><small id="tag"></small><h2 id="title"></h2><p id="detail"></p><button class="primary" id="again"></button><button id="menu" class="secondary">К выбору трассы</button></div></section>
<div id="touch" hidden><div><button data-action="left" aria-label="Влево">◀</button><button data-action="right" aria-label="Вправо">▶</button></div><div><button data-action="duck" aria-label="Пригнуться">↓</button><button data-action="jump" aria-label="Прыжок">↑</button></div></div></main>
<footer><span><kbd>←</kbd><kbd>→</kbd> движение　<kbd>Пробел</kbd> прыжок　<kbd>↓</kbd> пригнуться</span><button id="skins">Облик · <b>Графит</b> ↻</button></footer><script src="game.js"></script></body></html>
